<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATRA-X | Alchemy Architects</title><style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 20% 10%,rgba(94,231,242,.08),transparent 30%),radial-gradient(circle at 80% 20%,rgba(139,124,255,.08),transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{overflow:hidden}.app{display:grid;grid-template-columns:260px 1fr;height:100vh}.sidebar{border-right:1px solid var(--line);background:linear-gradient(180deg,#07111c,#050b13);padding:24px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}.brand img{width:175px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:8px}.nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:12px 14px;border-radius:12px;text-align:left;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:linear-gradient(90deg,rgba(94,231,242,.10),rgba(139,124,255,.07));border-color:#19344d;color:var(--text)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.signal{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.main{overflow:auto;padding:24px 28px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.title h1{margin:0;font-size:28px;letter-spacing:-.6px}.title p{margin:6px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}.btn{background:linear-gradient(180deg,#11263a,#0c1c2b);border:1px solid #21445f;color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800}.btn.primary{border-color:#317d8d;box-shadow:0 0 18px rgba(94,231,242,.08)}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(15,31,45,.92),rgba(7,18,28,.92));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:850;letter-spacing:-.8px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.delta{font-size:11px;margin-top:7px}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.cyan{color:var(--cyan)}.violet{color:#b7b0ff}.two{grid-template-columns:1.4fr .9fr}.three{grid-template-columns:1fr 1fr 1fr}.section{margin-top:18px}.section h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#a8bed0;margin:0 0 10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 9px;border-bottom:1px solid #122739;text-align:left;font-size:12px}.table th{color:#91adbf;text-transform:uppercase;letter-spacing:.8px;font-size:10px}.pill{display:inline-flex;padding:5px 9px;border:1px solid #28465b;border-radius:999px;font-size:10px;color:#b7cddd}.panel{background:linear-gradient(180deg,rgba(9,21,33,.95),rgba(6,15,24,.95));border:1px solid var(--line);border-radius:16px;padding:18px}.bar{height:10px;background:#0d2030;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:999px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{background:#081623;border:1px solid #17334a;border-radius:12px;padding:12px}.mini b{display:block;font-size:17px;margin-top:4px}.hero{padding:22px;background:radial-gradient(circle at 75% 20%,rgba(94,231,242,.11),transparent 30%),linear-gradient(120deg,#081522,#07111b);border:1px solid #17354c;border-radius:18px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 45%,rgba(255,255,255,.03) 48%,transparent 52%);animation:sweep 7s linear infinite}@keyframes sweep{to{transform:translateX(40%)}}.hero h2{font-size:30px;margin:2px 0 8px}.hero p{max-width:720px;color:#9eb7c7;line-height:1.55}.hero-tag{display:inline-flex;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid #1d4356;color:#9fe7ef;background:#071923;font-size:10px;letter-spacing:1px;text-transform:uppercase}.chart{min-height:220px;position:relative}.bars{display:flex;align-items:end;height:180px;gap:10px;padding:14px 0}.bars div{flex:1;background:linear-gradient(180deg,var(--violet),var(--cyan));border-radius:8px 8px 3px 3px;min-width:20px}.bars small{display:block;text-align:center;color:#7e99ad;margin-top:6px;font-size:9px}.spark{height:180px;display:flex;align-items:center}.spark svg{width:100%;height:150px}.graphwrap{height:420px;position:relative;overflow:hidden;border-radius:16px;border:1px solid #153249;background:radial-gradient(circle at center,rgba(94,231,242,.05),transparent 55%),#07131e}.graphwrap canvas{width:100%;height:100%}.workbench{display:grid;grid-template-columns:1fr 90px 1fr;gap:12px;align-items:stretch}.record h3{margin:0 0 12px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{padding:10px;border:1px solid #173149;border-radius:10px;background:#081521}.kv span{display:block;color:#7e97aa;font-size:9px;text-transform:uppercase}.kv b{display:block;margin-top:3px;font-size:12px}.score{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px}.score .big{font-size:36px;font-weight:900;color:var(--cyan)}.score .ring{width:74px;height:74px;border-radius:50%;margin:auto;background:conic-gradient(var(--cyan) 0 338deg,#163043 338deg 360deg);display:grid;place-items:center}.score .ring:after{content:"";width:56px;height:56px;border-radius:50%;background:#07131f;display:block}.chat{display:flex;flex-direction:column;height:430px}.messages{overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1;padding:4px}.msg{max-width:84%;padding:11px 13px;border-radius:13px;border:1px solid #1c354b;font-size:12px;line-height:1.45}.msg.ai{background:#091b28}.msg.user{margin-left:auto;background:#0f2432;border-color:#27506b}.chatbar{display:flex;gap:8px;margin-top:8px}.chatbar input{flex:1;background:#07131f;color:var(--text);border:1px solid #1a3950;border-radius:10px;padding:12px}.input{background:#07131f;color:var(--text);border:1px solid #1a3950;border-radius:10px;padding:10px;width:100%}.muted{color:var(--muted)}.hidden{display:none!important}.footer-note{font-size:10px;color:#628094;margin-top:10px}.counter{font-variant-numeric:tabular-nums}.danger{border-color:#6d2c3b!important;background:#210e16}.success{border-color:#1f5947!important;background:#0b2119}

</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5ee7f2"/><stop offset="1" stop-color="#8f7cff"/></linearGradient></defs><rect rx="20" width="320" height="90" fill="#07111e"/><circle cx="46" cy="45" r="27" fill="none" stroke="url(#g)" stroke-width="5"/><path d="M32 54 L46 30 L60 54" fill="none" stroke="#d8f7ff" stroke-width="4"/><text x="88" y="42" fill="#f2fbff" font-family="Inter,Arial" font-size="24" font-weight="800">MATRA-X</text><text x="88" y="65" fill="#86a6bc" font-family="Inter,Arial" font-size="12" letter-spacing="2">MATERIAL INTELLIGENCE NEXUS</text></svg></div></div><div class="eyebrow">Alchemy Architects</div><nav class="nav" id="nav"><button class="active" data-view="overview">◈ <span>Command Center</span></button><button data-view="data">▦ <span>Material Explorer</span></button><button data-view="workbench">⌁ <span>Match Workbench</span></button><button data-view="counterfactual">◎ <span>Counterfactual Lab</span></button><button data-view="graph">◉ <span>Knowledge Graph</span></button><button data-view="governance">✓ <span>Governance</span></button><button data-view="procurement">◇ <span>Procurement Intel</span></button><button data-view="copilot">✦ <span>Material Copilot</span></button></nav><div class="side-bottom"><div class="signal"><span class="dot"></span> Prototype systems online</div><div class="footer-note">SIH26099 · Software / Smart Automation</div></div></aside><main class="main"><div class="topbar"><div class="title"><div class="eyebrow">NATIONAL MATERIAL INTELLIGENCE LAYER</div><h1 id="pageTitle">MATRA-X Command Center</h1><p id="pageSub">Evidence-driven harmonization across heterogeneous CPSE material masters.</p></div><div class="actions"><button class="btn" id="ingestBtn">＋ Ingest CSV</button><button class="btn primary" id="runBtn">Run Harmonization</button><input class="hidden" type="file" id="fileInput" accept=".csv,text/csv"></div></div><section id="viewRoot"></section></main></div><script>const state={view:'overview',materials:[],matches:[],approved:0,runCount:0,live:1};
const demo=[
{id:'A-18472',cpse:'CPCL',desc:'HEX BOLT M16 X 80 SS304',cat:'FASTENER',uom:'EA',size:'M16',dim:'80',grade:'SS304',std:'DIN 933',canonical:'CM-0001'},
{id:'B-77341',cpse:'ONGC',desc:'SS 304 HEX HD BOLT 16MM-80MM',cat:'FASTENER',uom:'EA',size:'M16',dim:'80',grade:'SS304',std:'DIN 933',canonical:'CM-0001'},
{id:'C-55182',cpse:'SAIL',desc:'HEXAGONAL HEAD BOLT M16 X 80MM SS304',cat:'FASTENER',uom:'EA',size:'M16',dim:'80',grade:'SS304',std:'DIN 933',canonical:'CM-0001'},
{id:'A-18231',cpse:'CPCL',desc:'VALVE GATE 2 IN 150# FLANGED CS',cat:'VALVE',uom:'EA',size:'2 IN',dim:'150',grade:'CARBON STEEL',std:'API 600',canonical:'CM-0002'},
{id:'B-88201',cpse:'ONGC',desc:'2IN GATE VALVE CL150 CS RF FLG',cat:'VALVE',uom:'EA',size:'2 IN',dim:'150',grade:'CARBON STEEL',std:'API 600',canonical:'CM-0002'},
{id:'C-45211',cpse:'SAIL',desc:'GATE VLV 2 INCH CLASS 150 CARBON STEEL',cat:'VALVE',uom:'EA',size:'2 IN',dim:'150',grade:'CARBON STEEL',std:'API 600',canonical:'CM-0002'},
{id:'A-HARD-1',cpse:'CPCL',desc:'HEX BOLT M16 X 90 SS304',cat:'FASTENER',uom:'EA',size:'M16',dim:'90',grade:'SS304',std:'DIN 933',canonical:'HARD'},
{id:'B-HARD-1',cpse:'ONGC',desc:'GATE VALVE 2 IN 600# FLANGED CS',cat:'VALVE',uom:'EA',size:'2 IN',dim:'600',grade:'CARBON STEEL',std:'API 600',canonical:'HARD'}
];
state.materials=demo;
const root=document.getElementById('viewRoot'); const nav=document.getElementById('nav');
function esc(s){return (s??'').toString().replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));}
function score(a,b){let s=0,checks=[]; if(a.cat===b.cat){s+=20;checks.push(['Category','match'])} else checks.push(['Category','conflict']); const fields=[['Size','size'],['Dimension','dim'],['Grade','grade'],['Standard','std'],['UOM','uom']]; for(const [label,k] of fields){if(a[k]&&b[k]&&a[k].toLowerCase()===b[k].toLowerCase()){s+=14;checks.push([label,'match'])} else if(a[k]&&b[k]) checks.push([label,'conflict']); else checks.push([label,'missing'])} const tok=x=>new Set(x.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean)); const A=tok(a.desc),B=tok(b.desc); let inter=0;A.forEach(x=>B.has(x)&&inter++);const union=new Set([...A,...B]).size; const lex=union?inter/union:0; s+=34*lex; return {score:Math.min(99.7,Math.max(9,Math.round(s*10)/10)),checks};}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view)); const map={overview:['MATRA-X Command Center','Evidence-driven harmonization across heterogeneous CPSE material masters.'],data:['Material Explorer','Inspect normalized identities, source provenance and candidate relationships.'],workbench:['Match Workbench','Compare candidates with technical evidence rather than opaque similarity scores.'],counterfactual:['Counterfactual Engineering Lab','Stress-test the identity model by changing one engineering attribute at a time.'],graph:['Evidence & Provenance Graph','Trace source records, canonical identities, decisions and supporting evidence.'],governance:['Human Governance Center','Review, approve, reject and feed decisions back into continuous learning.'],procurement:['Procurement Intelligence','Surface cross-CPSE demand aggregation, idle stock and sourcing opportunities.'],copilot:['Material Copilot','Natural-language interface over the governed material intelligence layer.']}; document.getElementById('pageTitle').textContent=map[state.view][0];document.getElementById('pageSub').textContent=map[state.view][1]; const fn={overview:viewOverview,data:viewData,workbench:viewWorkbench,counterfactual:viewCounterfactual,graph:viewGraph,governance:viewGovernance,procurement:viewProcurement,copilot:viewCopilot}[state.view]; root.innerHTML=fn(); if(state.view==='graph') initGraph(); if(state.view==='counterfactual') bindCounter(); if(state.view==='workbench') bindWorkbench(); if(state.view==='copilot') bindCopilot(); }
function viewOverview(){return `<div class="hero"><div class="hero-tag">◈ live prototype · SIH26099</div><h2>One material. One governed identity.</h2><p>MATRA-X converts fragmented industrial material records into explainable, engineering-aware identities. It discovers candidate equivalence, blocks technical contradictions, preserves legacy traceability and exposes procurement intelligence.</p><div class="mini-grid"><div class="mini"><span class="label">Material records</span><b class="counter">${state.materials.length}</b></div><div class="mini"><span class="label">Candidate groups</span><b>${state.matches.length||2}</b></div><div class="mini"><span class="label">Review state</span><b class="green">Human-in-loop</b></div></div></div><div class="grid cards section"><div class="card"><div class="label">Harmonization confidence</div><div class="metric cyan">94.7%</div><div class="delta green">↑ calibrated target band</div></div><div class="card"><div class="label">Technical conflicts</div><div class="metric red">2</div><div class="delta amber">blocked from consolidation</div></div><div class="card"><div class="label">Proposed common IDs</div><div class="metric">2</div><div class="delta green">traceable to 6 sources</div></div><div class="card"><div class="label">Review queue</div><div class="metric">4</div><div class="delta violet">priority by uncertainty</div></div></div><div class="grid two section"><div class="panel"><h2>Harmonization signal</h2><div class="bars"><div style="height:74%"><small>FAST</small></div><div style="height:92%"><small>VALVE</small></div><div style="height:63%"><small>PIPE</small></div><div style="height:48%"><small>BEAR</small></div><div style="height:82%"><small>GASK</small></div><div style="height:58%"><small>INST</small></div></div><div class="muted">Illustrative prototype telemetry · replace with measured benchmark results before submission.</div></div><div class="panel"><h2>Decision guard</h2><div class="mini-grid"><div class="mini"><span class="label">Semantic</span><b>95%</b></div><div class="mini"><span class="label">Attributes</span><b>100%</b></div><div class="mini"><span class="label">Evidence</span><b>88%</b></div></div><div style="margin-top:14px" class="bar"><span style="width:88%"></span></div><div class="footer-note">No automatic merge when evidence is incomplete or a critical specification conflicts.</div></div></div>`}
function viewData(){return `<div class="panel"><div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><input id="search" class="input" placeholder="Search material descriptions, codes, categories…"><span class="pill">${state.materials.length} records</span></div><table class="table"><thead><tr><th>CPSE</th><th>Code</th><th>Description</th><th>Category</th><th>Grade</th><th>Standard</th><th>Status</th></tr></thead><tbody>${state.materials.map(m=>`<tr><td>${esc(m.cpse)}</td><td>${esc(m.id)}</td><td>${esc(m.desc)}</td><td><span class="pill">${esc(m.cat)}</span></td><td>${esc(m.grade)}</td><td>${esc(m.std)}</td><td>${m.canonical==='HARD'?'<span class="pill red">CONFLICT CANDIDATE</span>':'<span class="pill">SOURCE</span>'}</td></tr>`).join('')}</tbody></table><div class="footer-note">Data lineage is visible at every record; demo data is synthetic. Use the CSV importer to load real/public research datasets.</div></div>`}
function viewWorkbench(){const a=state.materials[0],b=state.materials[1],r=score(a,b);return `<div class="workbench"><div class="panel record"><h3>${esc(a.cpse)} <span class="pill">${esc(a.id)}</span></h3><p class="muted">${esc(a.desc)}</p><div class="kv">${[['Category','cat'],['UOM','uom'],['Size','size'],['Dimension','dim'],['Material Grade','grade'],['Standard','std']].map(([l,k])=>`<div><span>${l}</span><b>${esc(a[k])}</b></div>`).join('')}</div></div><div class="panel score"><div class="ring"><div></div></div><div class="big">${r.score}%</div><div class="muted">candidate equivalence</div><button id="approveBtn" class="btn primary">Approve cluster</button></div><div class="panel record"><h3>${esc(b.cpse)} <span class="pill">${esc(b.id)}</span></h3><p class="muted">${esc(b.desc)}</p><div class="kv">${[['Category','cat'],['UOM','uom'],['Size','size'],['Dimension','dim'],['Material Grade','grade'],['Standard','std']].map(([l,k])=>`<div><span>${l}</span><b>${esc(b[k])}</b></div>`).join('')}</div></div></div><div class="grid two section"><div class="panel"><h2>Evidence matrix</h2>${r.checks.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #13293a"><span>${c[0]}</span><b class="${c[1]==='match'?'green':c[1]==='conflict'?'red':'amber'}">${c[1].toUpperCase()}</b></div>`).join('')}</div><div class="panel"><h2>Explainable decision path</h2><p class="muted">Semantic retrieval proposes the pair. Structured attributes validate engineering identity. The contradiction gate has veto authority over unsafe consolidation. Human approval creates the governed mapping.</p><div class="mini-grid"><div class="mini"><span class="label">Legacy mapping</span><b>3 → 1</b></div><div class="mini"><span class="label">Canonical ID</span><b>CM-0001</b></div><div class="mini"><span class="label">Provenance</span><b>6 events</b></div></div></div></div>`}
function viewCounterfactual(){return `<div class="grid two"><div class="panel"><h2>Material under test</h2><div class="mini-grid"><div class="mini"><span class="label">Type</span><b>HEX BOLT</b></div><div class="mini"><span class="label">Size</span><b>M16</b></div><div class="mini"><span class="label">Grade</span><b>SS304</b></div></div><div style="margin-top:18px"><label class="label">Length: <span id="lenVal">80</span> mm</label><input id="len" type="range" min="40" max="140" value="80" style="width:100%"></div><div style="margin-top:18px"><label class="label">Grade</label><select id="gradeSel" class="input"><option>SS304</option><option>SS316</option><option>CARBON STEEL</option></select></div><div style="margin-top:18px"><label class="label">Pressure class</label><select id="presSel" class="input"><option>150</option><option>300</option><option>600</option></select></div></div><div class="panel"><h2>Counterfactual output</h2><div id="cfOut"></div></div></div>`}
function bindCounter(){const len=document.getElementById('len'),g=document.getElementById('gradeSel'),p=document.getElementById('presSel');function calc(){const l=+len.value,grade=g.value,pr=p.value;document.getElementById('lenVal').textContent=l;let score=96;const conflicts=[];if(l!==80){score-=Math.min(38,Math.abs(l-80)*.7);conflicts.push(`Length changed: 80 → ${l} mm`)}if(grade!=='SS304'){score-=28;conflicts.push(`Grade changed: SS304 → ${grade}`)}if(pr!=='150'){score-=20;conflicts.push(`Pressure class changed: 150 → ${pr}`)}const blocked=conflicts.length>=1 && (grade!=='SS304'||pr!=='150'||l!==80);document.getElementById('cfOut').innerHTML=`<div class="metric ${blocked?'red':'green'}">${Math.max(8,score).toFixed(1)}%</div><p class="muted">${blocked?'Candidate similarity remains high, but technical evidence changed. Harmonization is blocked or routed to review.':'Baseline candidate remains technically compatible.'}</p>${conflicts.length?'<div class="panel danger"><b class="red">TECHNICAL CONFLICT DETECTED</b><ul>'+conflicts.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul></div>':'<div class="panel success"><b class="green">NO CONFLICT</b><p class="muted">All tested critical attributes remain aligned.</p></div>'}<div style="margin-top:14px" class="bar"><span style="width:${Math.max(8,score)}%"></span></div>`};[len,g,p].forEach(x=>x.oninput=calc);calc()}
function viewGraph(){return `<div class="graphwrap"><canvas id="graphCanvas"></canvas></div><div class="grid three section"><div class="panel"><h2>Identity node</h2><div class="metric cyan">CM-0001</div><div class="muted">Canonical material identity</div></div><div class="panel"><h2>Sources</h2><div class="metric">3</div><div class="muted">CPCL · ONGC · SAIL</div></div><div class="panel"><h2>Evidence links</h2><div class="metric">18</div><div class="muted">attribute + decision provenance</div></div></div>`}
function initGraph(){const c=document.getElementById('graphCanvas'),ctx=c.getContext('2d');function fit(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}fit();const W=c.clientWidth,H=c.clientHeight;const nodes=[{x:W*.5,y:H*.5,r:46,t:'CM-0001'},{x:W*.2,y:H*.24,r:30,t:'CPCL'},{x:W*.78,y:H*.24,r:30,t:'ONGC'},{x:W*.21,y:H*.76,r:30,t:'SAIL'},{x:W*.79,y:H*.76,r:30,t:'DIN 933'},{x:W*.5,y:H*.14,r:28,t:'SS304'}];let t=0;function draw(){t+=.008;ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(94,231,242,.22)';ctx.lineWidth=1;for(const n of nodes){ctx.beginPath();ctx.moveTo(W*.5,H*.5);ctx.lineTo(n.x,n.y);ctx.stroke()}for(let i=0;i<nodes.length;i++){const n=nodes[i],pulse=1+0.08*Math.sin(t*8+i);ctx.beginPath();ctx.arc(n.x,n.y,n.r*pulse,0,Math.PI*2);ctx.fillStyle=i===0?'rgba(94,231,242,.09)':'rgba(139,124,255,.07)';ctx.fill();ctx.strokeStyle=i===0?'#5ee7f2':'#6c71bd';ctx.stroke();ctx.fillStyle='#eaf7ff';ctx.font=i===0?'800 14px Inter':'700 11px Inter';ctx.textAlign='center';ctx.fillText(n.t,n.x,n.y+4)}requestAnimationFrame(draw)}draw()}
function viewGovernance(){return `<div class="grid two"><div class="panel"><h2>Review queue</h2><table class="table"><thead><tr><th>Pair</th><th>Confidence</th><th>Risk</th><th>Action</th></tr></thead><tbody><tr><td>A-18472 ↔ B-77341</td><td class="green">95.6%</td><td>LOW</td><td><button class="btn">Review</button></td></tr><tr><td>A-HARD-1 ↔ A-18472</td><td class="amber">84.1%</td><td class="red">SPEC CONFLICT</td><td><button class="btn">Inspect</button></td></tr><tr><td>B-88201 ↔ C-45211</td><td class="green">93.2%</td><td>LOW</td><td><button class="btn">Review</button></td></tr></tbody></table></div><div class="panel"><h2>Learning loop</h2><div class="mini-grid"><div class="mini"><span class="label">Decisions captured</span><b>128</b></div><div class="mini"><span class="label">Disagreements</span><b>11</b></div><div class="mini"><span class="label">Rules refined</span><b>7</b></div></div><p class="muted" style="margin-top:14px">Reviewer outcomes can be used for threshold calibration, hard-negative mining and active-learning batches. No silent model change is allowed; every released model gets a versioned audit event.</p><div class="panel success"><b class="green">Governance invariant</b><p class="muted">AI proposes. Technical rules constrain. An authorized expert approves.</p></div></div></div>`}
function viewProcurement(){return `<div class="grid cards"><div class="card"><div class="label">Cross-CPSE common demand</div><div class="metric">45,000</div><div class="delta cyan">illustrative units</div></div><div class="card"><div class="label">Dormant stock candidate</div><div class="metric green">1,200</div><div class="delta">illustrative units</div></div><div class="card"><div class="label">Potential new duplicates</div><div class="metric red">17</div><div class="delta">prevented at entry</div></div><div class="card"><div class="label">Data quality lift</div><div class="metric">+21%</div><div class="delta">prototype target</div></div></div><div class="grid two section"><div class="panel"><h2>Demand aggregation</h2><div class="bars"><div style="height:44%"><small>CPCL</small></div><div style="height:63%"><small>ONGC</small></div><div style="height:78%"><small>SAIL</small></div><div style="height:52%"><small>BHEL</small></div><div style="height:37%"><small>NTPC</small></div></div></div><div class="panel"><h2>Dead-stock transfer logic</h2><div class="mini-grid"><div class="mini"><span class="label">Material</span><b>CM-0001</b></div><div class="mini"><span class="label">Need</span><b>Urgent</b></div><div class="mini"><span class="label">Available</span><b>1,200</b></div></div><p class="muted" style="margin-top:12px">Before a new tender request is raised, search governed inventory for technically compatible dormant stock. Any substitute recommendation stays subject to engineering approval.</p></div></div>`}
function viewCopilot(){return `<div class="chat panel"><div class="messages" id="messages"><div class="msg ai"><b>MATRA Copilot</b><br>I can explain material matches, expose conflicting specifications, compare source records, draft a standardized description, or show provenance for a proposed common identity.</div><div class="msg ai">Try: <i>“Why did CPCL A-18472 match ONGC B-77341?”</i></div></div><div class="chatbar"><input id="chatInput" placeholder="Ask about a material, match, conflict or governance decision…"><button class="btn primary" id="sendChat">Send</button></div></div>`}
function bindWorkbench(){document.getElementById('approveBtn').onclick=()=>{state.approved++;alert('Demo action recorded: cluster approved and audit event created.');}}
function bindCopilot(){document.getElementById('sendChat').onclick=()=>{const inp=document.getElementById('chatInput');const q=inp.value.trim();if(!q)return;const box=document.getElementById('messages');box.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div>`);let ans='For the demo pair, the system combines semantic similarity with category, size, dimension, grade, standard and UOM checks. A critical mismatch would block automatic harmonization and route the pair to an expert.';if(/why|match/i.test(q)&&/18472|77341|bolt/i.test(q))ans='A-18472 and B-77341 are proposed as equivalent because the category, M16 size, 80 mm dimension, SS304 grade, DIN 933 standard and UOM align after normalization; the descriptions differ mainly in ordering and abbreviation.';if(/conflict|hard/i.test(q))ans='The hard-negative case is intentionally deceptive: semantic similarity remains high, but a critical technical attribute changes. MATRA-X treats the contradiction as a veto/mandatory-review signal.';box.insertAdjacentHTML('beforeend',`<div class="msg ai">${esc(ans)}</div>`);inp.value='';box.scrollTop=box.scrollHeight}}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.view=b.dataset.view;render()});document.getElementById('ingestBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=r.result.split(/\r?\n/).filter(Boolean);const head=lines[0].split(',');const parsed=lines.slice(1,201).map(line=>{const c=line.split(',');const o={};head.forEach((h,i)=>o[h]=c[i]||'');return {id:o.material_code||o.code||('IMP-'+Math.random().toString(36).slice(2,7)),cpse:o.source_cpse||o.cpse||'IMPORTED',desc:o.description||o.material_description||'',cat:o.category||'UNKNOWN',uom:o.uom||'',size:o.size||'',dim:o.dimension||'',grade:o.material_grade||'',std:o.standard||'',canonical:o.canonical_hint||'IMPORTED'}});state.materials=parsed;alert(`Imported ${parsed.length} rows into the prototype explorer.`);render()};r.readAsText(f)};document.getElementById('runBtn').onclick=()=>{state.runCount++;state.matches=[['A-18472','B-77341'],['A-18231','B-88201']];const btn=document.getElementById('runBtn');btn.textContent='Harmonization complete ✓';setTimeout(()=>btn.textContent='Run Harmonization',1400);render()};render();if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script></body></html>
