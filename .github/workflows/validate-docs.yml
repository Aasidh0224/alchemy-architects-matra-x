name: Validate MATRA-X Docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_pdfs.py
      - run: test -s reports/MATRA_X_Technical_Report_SIH26099.pdf
      - run: test -s reports/MATRA_X_User_Manual_SIH2026.pdf